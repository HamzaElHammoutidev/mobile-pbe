name: Preview Build and Push

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build Docker Image and Push to Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    outputs:
      preview-url: ${{ steps.generate-url.outputs.preview-url }}
      image-tag: ${{ steps.generate-url.outputs.image-tag }}
      image-full: ${{ steps.generate-url.outputs.image-full }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Generate Preview URL
        id: generate-url
        run: |
          # Sanitize branch name for URL (replace / with -, remove special chars)
          BRANCH_RAW="${{ github.ref_name }}"
          BRANCH_SLUG=$(echo "$BRANCH_RAW" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')

          # Generate preview URL
          PREVIEW_URL="https://preview-${BRANCH_SLUG}-${{ github.run_id }}.staging.parebriseexpress.ma"

          # Image tag (commit SHA)
          IMAGE_TAG="${{ github.sha }}"

          # Full image reference
          IMAGE_FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${IMAGE_TAG}"

          # Export outputs
          echo "preview-url=${PREVIEW_URL}" >> $GITHUB_OUTPUT
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image-full=${IMAGE_FULL}" >> $GITHUB_OUTPUT

          # Display for logs
          echo "Preview URL: ${PREVIEW_URL}"
          echo "Image Tag: ${IMAGE_TAG}"
          echo "Full Image: ${IMAGE_FULL}"

      - name: Post preview URL comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.generate-url.outputs.preview-url }}';
            const imageTag = '${{ steps.generate-url.outputs.image-tag }}';
            const runId = '${{ github.run_id }}';

            const commentBody = `## 🚀 Preview Deployed!

            **Preview URL:** ${previewUrl}
            **Image Tag:** \`${imageTag}\`
            **Build Run:** [#${runId}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${runId})

            ### Pages Available
            All 9 pages are accessible:
            - 🏠 Homepage
            - ℹ️ About
            - 🔧 Services
            - 💼 Partnerships
            - 📰 Blog
            - 💳 Financing
            - 📞 Contact
            - 📋 Legal
            - 🚗 Careers

            ### Review Checklist
            - [ ] Homepage loads without errors
            - [ ] Navigation works on mobile (375px)
            - [ ] All images load correctly
            - [ ] Responsive layout on tablet (768px)
            - [ ] All 9 pages accessible via navigation
            - [ ] Browser console shows no errors

            ---
            *Preview lifetime: 7 days | Auto-generated by GitHub Actions*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

      - name: Post preview URL comment on commit (non-PR)
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.generate-url.outputs.preview-url }}';
            const imageTag = '${{ steps.generate-url.outputs.image-tag }}';
            const runId = '${{ github.run_id }}';

            const commitSha = '${{ github.sha }}';

            const commentBody = `🚀 **Preview deployed:** ${previewUrl}\n\n` +
              `📦 **Image:** \`${imageTag}\`\n` +
              `🔗 **Build:** [Actions Run #${runId}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${runId})\n\n` +
              `*Preview lifetime: 7 days*`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              body: commentBody
            });
